<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AnimationLab Three.js Short Starter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #060b18;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }
    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
    }
    #gl-canvas {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      display: block;
    }
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 88px 64px 120px 64px;
    }
    .top-bar {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .badge {
      display: inline-block;
      align-self: flex-start;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.12em;
      background: rgba(56, 189, 248, 0.16);
      border: 2px solid rgba(56, 189, 248, 0.65);
      color: #7dd3fc;
    }
    .headline {
      font-size: 68px;
      line-height: 1.04;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-shadow: 0 6px 28px rgba(0, 0, 0, 0.75);
    }
    .bottom-card {
      background: rgba(9, 15, 32, 0.78);
      border: 2px solid rgba(148, 163, 184, 0.35);
      border-left: 8px solid #38bdf8;
      border-radius: 18px;
      padding: 28px 34px;
      backdrop-filter: blur(8px);
    }
    .caption {
      font-size: 36px;
      line-height: 1.32;
      font-weight: 600;
      color: #e2e8f0;
    }
    .meta-row {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
    }
    .progress-track {
      margin-top: 14px;
      height: 6px;
      background: rgba(148, 163, 184, 0.25);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #f97316);
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl-canvas" width="1080" height="1920"></canvas>
    <div id="hud">
      <div class="top-bar">
        <div id="badge" class="badge">READY</div>
        <h1 id="headline" class="headline"></h1>
      </div>
      <div class="bottom-card">
        <div id="caption" class="caption"></div>
        <div class="meta-row">
          <span id="timecode">T+00.00s</span>
          <span id="beat-name">SCENE 1</span>
        </div>
        <div class="progress-track"><div id="progress" class="progress-fill"></div></div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/scene.js"></script>
</body>
</html>
